<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qui Paie ?</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <h1>Qui Paie ?</h1>
        <p>Le tirage fun qui decide qui regle l'addition.</p>
      </header>

      <main class="layout">
        <section class="card participants-card">
          <div class="card-header">
            <h2>Participants</h2>
            <span id="participantCount" class="pill">0</span>
          </div>

          <form id="participantForm" class="participant-form">
            <input
              id="participantName"
              type="text"
              maxlength="24"
              placeholder="Ajouter un prenom"
              aria-label="Nom du participant"
              required
            />
            <input
              id="participantEmoji"
              type="text"
              maxlength="2"
              placeholder="🙂"
              aria-label="Emoji du participant"
            />
            <button type="submit">Ajouter</button>
          </form>

          <ul id="participantsList" class="participants-list"></ul>
        </section>

        <section class="card game-card">
          <div class="card-header">
            <h2>Tirage</h2>
            <button id="replayBtn" class="ghost">Rejouer</button>
          </div>

          <div class="controls-grid">
            <label>
              Mode de jeu
              <select id="modeSelect">
                <option value="classic">Classique</option>
                <option value="lucky">Chanceux 🍀</option>
                <option value="mixed">Mixte 🎲</option>
              </select>
            </label>

            <label class="switch-row">
              <input id="luckyEnabled" type="checkbox" checked />
              <span>Activer le mode Chanceux</span>
            </label>

            <label>
              Probabilite Chanceux
              <div class="inline-field">
                <input
                  id="luckyProbability"
                  type="range"
                  min="0"
                  max="100"
                  step="1"
                  value="10"
                />
                <span id="luckyProbabilityValue">10%</span>
              </div>
            </label>

            <label class="switch-row">
              <input id="fairMode" type="checkbox" />
              <span>Mode equitable</span>
            </label>
          </div>

          <div id="spinner" class="spinner">
            <div id="spinnerText" class="spinner-text">Pret pour le tirage</div>
          </div>

          <div class="actions">
            <button id="drawBtn" class="primary">Tirer au sort</button>
            <button id="excludeBtn" class="danger" disabled>
              Exclure le dernier selectionne
            </button>
          </div>

          <div id="result" class="result" aria-live="polite">
            Ajoute au moins 2 participants pour commencer.
          </div>
        </section>

        <section class="card history-card">
          <div class="card-header">
            <h2>Historique</h2>
            <button id="clearHistoryBtn" class="ghost">Vider</button>
          </div>
          <ul id="historyList" class="history-list"></ul>
        </section>
      </main>
    </div>

    <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>
    <script src="./script.js"></script>
  </body>
</html>
